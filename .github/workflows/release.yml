name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotd4-release
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Test release publishing
        run: python3 .release/test_publish.py -v
      - name: Test isolated Python dependency setup
        run: python3 .release/test_python_deps.py -v
      - name: Verify package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release/publish.py
